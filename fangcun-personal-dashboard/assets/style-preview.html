<!DOCTYPE html>
<!--
  风格预览模板 · 个人工作台生成器
  用法：替换所有 {{占位符}}，把三套风格的 CSS 变量填进 .theme-a / .theme-b / .theme-c
  侧边栏和卡片内容必须换成用户真实的功能，不要留示例文字。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>风格预览 · {{用户的工作台名}}</title>
<style>
/* ============ 三套风格变量 ============ */
.theme-a{
  --bg:#eef2e6; --sidebar:#7d9471; --sidebar-text:#f0f4ea; --sidebar-active:#a8bc9c;
  --card:#fff; --text:#2f3a2c; --text-dim:#7a8574; --accent:#4a6741;
  --radius:18px; --shadow:0 2px 12px rgba(80,100,70,.08);
}
.theme-b{
  --bg:#ebe3d9; --sidebar:#f5f0e8; --sidebar-text:#6b5f52; --sidebar-active:#2d2620;
  --card:#fff; --text:#3d352c; --text-dim:#9c8f80; --accent:#2d2620;
  --radius:14px; --shadow:0 2px 10px rgba(120,100,80,.07);
}
.theme-c{
  --bg:#f0f6fc; --sidebar:#fff; --sidebar-text:#4a5568; --sidebar-active:#dbeafe;
  --card:#fff; --text:#1a202c; --text-dim:#718096; --accent:#2b7fff;
  --radius:14px; --shadow:0 2px 8px rgba(43,127,255,.08);
}

/* ============ 结构（三套共用） ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,"PingFang SC",system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  transition:background .25s;
}
.switcher{
  position:sticky; top:0; z-index:10; display:flex; gap:6px;
  padding:10px 12px calc(10px + env(safe-area-inset-top,0));
  background:rgba(255,255,255,.85); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(0,0,0,.06);
}
.switcher button{
  flex:1; padding:9px 4px; font-size:14px; font-family:inherit;
  border:1px solid rgba(0,0,0,.12); border-radius:9px;
  background:#fff; color:#333;
}
.switcher button.on{background:#1c1c1e;color:#fff;border-color:#1c1c1e}

.app{display:flex; min-height:calc(100vh - 56px)}

/* --- 侧边栏：常驻窄条，不是汉堡菜单 --- */
.side{
  width:76px; flex-shrink:0; background:var(--sidebar);
  padding:14px 6px calc(14px + env(safe-area-inset-bottom,0));
  transition:background .25s;
}
.side .brand{text-align:center;margin-bottom:14px}
.side .brand .logo{font-size:26px;line-height:1}
.side .brand .name{
  font-size:11px; color:var(--sidebar-text); opacity:.85;
  margin-top:4px; word-break:break-all; line-height:1.3;
}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{
  display:block; text-align:center; padding:10px 2px; border-radius:12px;
  text-decoration:none; color:var(--sidebar-text); font-size:11px; line-height:1.3;
}
.nav a .ico{display:block;font-size:21px;margin-bottom:3px}
.nav a.on{background:var(--sidebar-active)}
/* 暖棕包的选中态是深底白字，用这个类覆盖 */
.theme-b .nav a.on{color:#fff}

/* --- 内容区卡片流 --- */
.main{
  flex:1; min-width:0; padding:14px 12px calc(24px + env(safe-area-inset-bottom,0));
  display:flex; flex-direction:column; gap:12px;
}
.card{
  background:var(--card); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px; transition:all .25s;
}
.card h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.hint{font-size:12px;color:var(--text-dim);margin-top:8px}

/* 输入框字号必须 >=16px，否则 iOS 会自动放大整个页面 */
input[type=text],input[type=number]{
  width:100%; font-size:16px; font-family:inherit; color:var(--text);
  padding:11px 13px; border:1px solid rgba(0,0,0,.12);
  border-radius:calc(var(--radius) - 6px); background:transparent;
}
input::placeholder{color:var(--text-dim)}
.btn{
  padding:11px 18px; font-size:15px; font-family:inherit;
  border:none; border-radius:calc(var(--radius) - 6px);
  background:var(--accent); color:#fff;
}
.row{display:flex;gap:8px;align-items:center}

/* 勾选行 */
.todo{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(0,0,0,.08)}
.todo:last-child{border-bottom:none}
.box{
  width:21px;height:21px;flex-shrink:0;margin-top:1px;
  border:2px solid var(--accent);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#fff;
}
.todo.done .box{background:var(--accent)}
.todo.done .txt{text-decoration:line-through;color:var(--text-dim)}
.time{font-size:13px;color:var(--text-dim);flex-shrink:0;width:42px}
.txt{font-size:14px;line-height:1.5}

/* 数据条 */
.bar{height:8px;background:rgba(0,0,0,.08);border-radius:4px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.stat{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim)}
.big{font-size:26px;font-weight:600;color:var(--text)}
</style>
</head>
<body class="theme-a">

<div class="switcher">
  <button class="on" onclick="sw(this,'theme-a')">第 1 版</button>
  <button onclick="sw(this,'theme-b')">第 2 版</button>
  <button onclick="sw(this,'theme-c')">第 3 版</button>
</div>

<div class="app">
  <!-- 侧边栏：换成用户真实的功能，6-9 个 -->
  <aside class="side">
    <div class="brand">
      <div class="logo">{{品牌emoji}}</div>
      <div class="name">{{工作台名}}</div>
    </div>
    <nav class="nav">
      <a class="on"><span class="ico">{{emoji1}}</span>{{功能1}}</a>
      <a><span class="ico">{{emoji2}}</span>{{功能2}}</a>
      <a><span class="ico">{{emoji3}}</span>{{功能3}}</a>
      <a><span class="ico">{{emoji4}}</span>{{功能4}}</a>
      <a><span class="ico">{{emoji5}}</span>{{功能5}}</a>
      <a><span class="ico">⚙️</span>设置</a>
    </nav>
  </aside>

  <!-- 卡片区：装用户真实的内容，不要用占位文字 -->
  <main class="main">

    <!-- 卡片 1：勾选类，展示列表手感 -->
    <section class="card">
      <h2>{{emoji1}} {{卡片1标题}}</h2>
      <div class="todo done"><span class="box">✓</span><span class="time">07:00</span><span class="txt">{{用户真实的行程1}}</span></div>
      <div class="todo done"><span class="box">✓</span><span class="time">08:30</span><span class="txt">{{用户真实的行程2}}</span></div>
      <div class="todo"><span class="box"></span><span class="time">10:00</span><span class="txt">{{用户真实的行程3}}</span></div>
      <div class="todo"><span class="box"></span><span class="time">14:00</span><span class="txt">{{用户真实的行程4}}</span></div>
    </section>

    <!-- 卡片 2：可输入，让用户感受手感 -->
    <section class="card">
      <h2>{{emoji2}} {{卡片2标题}}</h2>
      <div class="row">
        <input type="text" placeholder="{{真实的输入提示，如：今天花了多少}}">
        <button class="btn">保存</button>
      </div>
      <p class="hint">这里可以真的输入，试试手感</p>
    </section>

    <!-- 卡片 3：数据展示 -->
    <section class="card">
      <h2>{{emoji3}} {{卡片3标题}}</h2>
      <div class="big">{{数值}}</div>
      <div class="bar"><i style="width:62%"></i></div>
      <div class="stat"><span>{{左侧说明}}</span><span>{{右侧说明}}</span></div>
    </section>

  </main>
</div>

<script>
function sw(btn, cls){
  document.body.className = cls;
  document.querySelectorAll('.switcher button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  window.scrollTo(0,0);
}
</script>
</body>
</html>
